[package]
name = "ocmd-core"
version = "1.0.0"
description = "Core domain logic and process execution engine for One-Click Media Downloader"
edition = "2021"

[lib]
name = "ocmd_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
regex = "1.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
tempfile = "3.10"
