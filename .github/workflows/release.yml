name: Signed Linux release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type verify to validate Linux release signing credentials from the current main HEAD'
        required: true
        type: choice
        options: [verify]
        default: verify

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main ancestry and consistent version sources
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo 'Signing verification must be dispatched from main.' >&2
              exit 1
            fi
            if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
              echo 'Verification SHA is no longer the current main HEAD; dispatch again from main.' >&2
              exit 1
            fi
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path

          package_version = json.loads(Path('package.json').read_text())['version']
          tauri_version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          host = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version']
          core = tomllib.loads(Path('src-tauri/crates/core/Cargo.toml').read_text())['package']['version']
          versions = [package_version, tauri_version, host, core]
          if len(set(versions)) != 1 or not re.fullmatch(r'\d+\.\d+\.\d+', package_version):
              raise SystemExit(f'Version sources diverge or are not SemVer: {versions}')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{package_version}':
              raise SystemExit('Release tag must exactly match the package SemVer.')
          if f'## {package_version}' not in Path('CHANGELOG.md').read_text():
              raise SystemExit('Current version is missing from CHANGELOG.md')
          PY

  signing-preflight:
    name: Linux release signing preflight
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dedicated release GPG key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash scripts/release/prepare-gpg-signing.sh

  release-linux:
    name: Build, verify, sign, and publish Linux x86_64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dedicated release GPG key before expensive work
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash scripts/release/prepare-gpg-signing.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Install pinned Python for media-tool test fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.10

      - name: Install Linux build and smoke-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes             build-essential curl file ffmpeg libayatana-appindicator3-dev libgtk-3-dev             libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config xvfb

      - name: Install pinned yt-dlp fixture tool
        run: python -m pip install --disable-pip-version-check yt-dlp==2026.8.19

      - name: Verify media test tool availability
        run: |
          ffmpeg -version
          ffprobe -version
          yt-dlp --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend boundary check
        run: npm run check:ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest and release-note tests
        run: npm test

      - name: Verify generated IPC bindings
        run: |
          npm run bindings
          git diff --exit-code -- src/generated/ipc.ts

      - name: Build frontend production bundle
        run: npm run build

      - name: Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/crates/core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/crates/core/Cargo.toml --locked

      - name: Test Tauri host
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Clippy core and host
        run: |
          cargo clippy --manifest-path src-tauri/crates/core/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          bash scripts/ci/audit-rust.sh

      - name: Audit shipped npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Linux Debian package
        run: npm run tauri -- build --bundles deb

      - name: Inspect and launch the exact Debian release artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          dpkg-deb --info "$package"
          package_root="$RUNNER_TEMP/opendownloader-release-package"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          dpkg-deb --extract "$package" "$package_root"
          test -x "$package_root/usr/bin/opendownloader"
          test -f "$package_root/usr/share/applications/openDownloader.desktop"
          set +e
          xvfb-run -a timeout 15s "$package_root/usr/bin/opendownloader"
          status=$?
          set -e
          test "$status" -eq 124

      - name: Stage the single Linux production artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          mkdir -p release-assets/platforms release-assets/final
          artifact_name="linux-x86_64__$(basename "${packages[0]}")"
          cp -- "${packages[0]}" "release-assets/platforms/$artifact_name"
          echo "LINUX_ARTIFACT=release-assets/platforms/$artifact_name" >> "$GITHUB_ENV"
          echo "LINUX_ARTIFACT_BASENAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Attest Linux package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-assets/platforms/*.deb

      - name: Create and verify GPG-authenticated release material
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LINUX_ARTIFACT"
          (cd release-assets/platforms && sha256sum -- "$LINUX_ARTIFACT_BASENAME") > release-assets/final/SHA256SUMS
          gpg --batch --armor --export "$RELEASE_GPG_FINGERPRINT" > release-assets/final/RELEASE-GPG-PUBLIC-KEY.asc
          test -s release-assets/final/RELEASE-GPG-PUBLIC-KEY.asc

          printf '%s' "$RELEASE_GPG_PASSPHRASE" |             gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0               --local-user "$RELEASE_GPG_FINGERPRINT"               --detach-sign --armor               --output "release-assets/final/$LINUX_ARTIFACT_BASENAME.asc"               "$LINUX_ARTIFACT"

          printf '%s' "$RELEASE_GPG_PASSPHRASE" |             gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0               --local-user "$RELEASE_GPG_FINGERPRINT"               --detach-sign --armor               --output release-assets/final/SHA256SUMS.asc               release-assets/final/SHA256SUMS

          gpg --verify "release-assets/final/$LINUX_ARTIFACT_BASENAME.asc" "$LINUX_ARTIFACT"
          gpg --verify release-assets/final/SHA256SUMS.asc release-assets/final/SHA256SUMS
          (cd release-assets/platforms && sha256sum --check ../final/SHA256SUMS)

      - name: Preserve exact signed release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: signed-linux-release-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Create version-specific release notes
        run: node scripts/release/extract-notes.mjs

      - name: Publish stable Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release-assets/platforms/*             release-assets/final/*             --verify-tag             --title "openDownloader $GITHUB_REF_NAME"             --notes-file release-notes.md
