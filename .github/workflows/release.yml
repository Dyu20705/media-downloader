          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          xcrun stapler validate "${dmgs[0]}"
      - name: Select expected package and create uniquely named artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifacts
          case "${{ matrix.bundle }}" in
            deb) shopt -s nullglob; files=(src-tauri/target/release/bundle/deb/*.deb) ;;
            nsis) shopt -s nullglob; files=(src-tauri/target/release/bundle/nsis/*-setup.exe) ;;
            dmg) shopt -s nullglob; files=(src-tauri/target/release/bundle/dmg/*.dmg) ;;
          esac
          test "${#files[@]}" -eq 1
          cp -- "${files[0]}" "release-artifacts/${{ matrix.platform }}__$(basename "${files[0]}")"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.platform }}
          path: release-artifacts/*
