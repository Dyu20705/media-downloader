            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expected) {
              throw "$($file.Name) signer thumbprint mismatch."
            }
          }
      - name: Verify macOS app signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          apps=(src-tauri/target/release/bundle/macos/*.app)
