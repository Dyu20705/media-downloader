name: Signed desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type verify to build signed packages from main without publishing a release'
        required: true
        type: choice
        options: [verify]
        default: verify
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main ancestry and consistent version sources
        run: |
          set -eu
          git fetch origin main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ]; then echo 'Verification builds must be dispatched from main.' >&2; exit 1; fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          package_version = json.loads(Path('package.json').read_text())['version']
          tauri_version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          host = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version']
          core = tomllib.loads(Path('src-tauri/crates/core/Cargo.toml').read_text())['package']['version']
          versions = [package_version, tauri_version, host, core]
          if len(set(versions)) != 1 or not re.fullmatch(r'\d+\.\d+\.\d+', package_version): raise SystemExit(f'Version sources diverge or are not SemVer: {versions}')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{package_version}': raise SystemExit('Release tag must exactly match the package SemVer.')
          if f'## {package_version}' not in Path('CHANGELOG.md').read_text(): raise SystemExit('Current version is missing from CHANGELOG.md')
          PY
  quality:
    name: Release quality and security gates (${{ github.sha }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install Tauri Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes build-essential curl file ffmpeg libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend boundary check
        run: npm run check:ci
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest and release-note tests
        run: npm test
      - name: Verify generated IPC bindings
        run: |
          npm run bindings
          git diff --exit-code -- src/generated/ipc.ts
      - name: Build frontend production bundle
        run: npm run build
      - name: Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/crates/core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/crates/core/Cargo.toml --locked
      - name: Test Tauri host
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy core and host
        run: |
          cargo clippy --manifest-path src-tauri/crates/core/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          bash scripts/ci/audit-rust.sh
      - name: Audit shipped npm dependencies
        run: npm audit --omit=dev --audit-level=high
  package:
    needs: [validate, quality]
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
            platform: linux-x86_64
          - os: windows-2025
            bundle: nsis
            platform: windows-x86_64
          - os: macos-15-intel
            bundle: dmg
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.0
      - run: npm ci --no-audit --fund=false
      - name: Require and import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD -or !$env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw 'Windows production signing secrets are required.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'opendownloader-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item -Force $pfx
      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_ISSUER" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_CONTENT" && test -n "$APPLE_TEAM_ID"
          keychain="$RUNNER_TEMP/opendownloader-signing.keychain-db"
          certificate="$RUNNER_TEMP/opendownloader-signing.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          rm -f "$certificate"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
      - name: Build signed native package
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Verify Windows installer Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one NSIS setup executable.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) { throw "Installer signature status: $($signature.Status)." }
          if ($signature.SignerCertificate.Thumbprint -ne ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '')) { throw 'Installer signer thumbprint mismatch.' }
      - name: Verify macOS app signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          apps=(src-tauri/target/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
      - name: Select expected package and create uniquely named artifact
        shell: bash
        run: |
          set -eu
          mkdir release-artifacts
          case "${{ matrix.bundle }}" in
            deb) shopt -s nullglob; files=(src-tauri/target/release/bundle/deb/*.deb) ;;
            nsis) shopt -s nullglob; files=(src-tauri/target/release/bundle/nsis/*-setup.exe) ;;
            dmg) shopt -s nullglob; files=(src-tauri/target/release/bundle/dmg/*.dmg) ;;
          esac
          test "${#files[@]}" -eq 1
          cp -- "${files[0]}" "release-artifacts/${{ matrix.platform }}__$(basename "${files[0]}")"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  verify-and-sign-manifest:
    needs: package
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: release-assets/platforms
          merge-multiple: true
      - name: Require and verify signed combined checksum manifest
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -eu
          test -n "$RELEASE_GPG_PRIVATE_KEY" -a -n "$RELEASE_GPG_PASSPHRASE" || { echo 'Signing verification requires RELEASE_GPG_PRIVATE_KEY and RELEASE_GPG_PASSPHRASE.' >&2; exit 1; }
          test "$(find release-assets/platforms -type f | wc -l)" -eq 3
          mkdir -p release-assets/final
          (cd release-assets/platforms && find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum) > release-assets/final/SHA256SUMS
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --armor --export > release-assets/final/RELEASE-GPG-PUBLIC-KEY.asc
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor release-assets/final/SHA256SUMS
          gpg --verify release-assets/final/SHA256SUMS.asc release-assets/final/SHA256SUMS
          (cd release-assets/platforms && sha256sum --check ../final/SHA256SUMS)
      - name: Upload signed artifacts for workflow-run smoke testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: signed-production-artifacts-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: verify-and-sign-manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: signed-production-artifacts-${{ github.sha }}
          path: release-assets
      - name: Create version-specific release notes
        run: node scripts/release/extract-notes.mjs
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/platforms/* release-assets/final/* --verify-tag --title "openDownloader $GITHUB_REF_NAME" --notes-file release-notes.md
