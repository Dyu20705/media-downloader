name: Contract checks
on:
  push:
  pull_request:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Verify media test dependencies
        run: |
          ffmpeg -version
          ffprobe -version
      - run: cargo fmt --manifest-path src-tauri/crates/core/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/crates/core/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/crates/core/Cargo.toml --all-targets -- -D warnings
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
