name: Contract checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check core formatting
        run: cargo fmt --manifest-path src-tauri/crates/core/Cargo.toml --check
      - name: Check Tauri host formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri/crates/core -> target
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - name: Install Python for offline tool fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.10
      - name: Install pinned yt-dlp fixture tool
        run: python -m pip install --disable-pip-version-check yt-dlp==2025.2.19
      - name: Verify test tool availability
        run: |
          ffmpeg -version
          ffprobe -version
          yt-dlp --version
      - name: Run core tests
        run: cargo test --locked --manifest-path src-tauri/crates/core/Cargo.toml
      - name: Run core Clippy with warnings denied
        run: cargo clippy --locked --manifest-path src-tauri/crates/core/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: Frontend and desktop configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --fund=false
      - name: Check frontend capability and desktop configuration boundaries
        run: npm run check:ci
      - name: Audit shipped npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Preserve the checked frontend build for Tauri compilation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  tauri-host:
    name: Tauri host compile (Ubuntu)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the frontend build produced by the blocking frontend job
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: frontend-dist
          path: dist
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - name: Compile the Tauri host against locked dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Run Tauri host Clippy with warnings denied
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run host integration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  packaged-linux-smoke:
    name: Linux package and launch smoke (Ubuntu)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Install Linux desktop and headless display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config xvfb
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
      - name: Build Linux package
        run: npm run tauri -- build --bundles deb
      - name: Inspect package metadata and bundled resources
        run: |
          set -eu
          package=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          mkdir package-root
          dpkg-deb --extract "$package" package-root
          test -x package-root/usr/bin/one-click-media-downloader
          test -f package-root/usr/share/applications/com.oneclick.media.downloader.desktop
      - name: Launch packaged application under a virtual display
        run: |
          set +e
          xvfb-run -a timeout 15s package-root/usr/bin/one-click-media-downloader
          status=$?
          set -e
          test "$status" -eq 124

  workflow-security:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history for PR diff scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.10
      - name: Install pinned workflow security linter
        run: python -m pip install --disable-pip-version-check zizmor==1.30.1
      - name: Audit workflow security and supply-chain risks
        run: zizmor --offline .github/workflows
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
          cache: false
      - name: Install pinned actionlint and Gitleaks
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Validate workflow syntax and expressions
        run: actionlint
      - name: Scan changed commits or current files for secrets
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ -n "$GITLEAKS_BASE_SHA" ] && \
             ! printf '%s' "$GITLEAKS_BASE_SHA" | grep -Eq '^0+$' && \
             git cat-file -e "${GITLEAKS_BASE_SHA}^{commit}" 2>/dev/null; then
            gitleaks git --redact --exit-code 1 \
              --log-opts="$GITLEAKS_BASE_SHA..$GITLEAKS_HEAD_SHA" .
          else
            gitleaks dir --redact --exit-code 1 .
          fi
