version: 2
updates:
  # v1.0.0 release freeze: keep security updates enabled while suppressing
  # routine version-update PR churn until the release is complete.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /src-tauri/crates/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
